name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Coverage gate for pkg/*
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go run ./tools/covergate -profile coverage.out -threshold 90
      - name: API contract (routes snapshot + OpenAPI golden)
        run: go test ./internal/app -run 'TestRouteSnapshot|TestOpenAPIGolden'
      - name: Commit message lint
        run: git log -1 --format=%B | go run github.com/conventionalcommit/commitlint@v0.12.0 lint

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t template-golang:ci .
      - name: Smoke run
        run: |
          docker run -d --name api --network host \
            -e APP_ENV=development \
            -e POSTGRES_DSN="postgres://postgres:postgres@localhost:5432/app?sslmode=disable" \
            -e REDIS_ADDR=localhost:6379 \
            -e JWT_SECRET=ci-secret-value \
            -e COOKIE_SECURE=false \
            template-golang:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/readyz >/dev/null; then
              echo "ready"; exit 0
            fi
            sleep 1
          done
          echo "container did not become ready"; docker logs api; exit 1
